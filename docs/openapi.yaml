openapi: 3.0.0
info:
  title: Accounts API
  version: 1.0.0
  description: API documentation for the Accounts system
  contact:
    name: Gary Zhang
    email: gary@mathsonline.com.au

servers:
  - url: /api/v1
    description: API v1

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Error:
      type: object
      properties:
        message:
          type: string
          description: Error message
        errors:
          type: object
          description: Validation errors if any

    User:
      type: object
      properties:
        id:
          type: integer
        email:
          type: string
          format: email
        username:
          type: string
        first_name:
          type: string
        last_name:
          type: string
        role_id:
          type: integer
          enum: [1, 2, 3, 4]
          description: |
            1: Admin
            2: Student
            3: Teacher
            4: Customer
        role:
          type: string
          enum: [Admin, Student, Teacher, Customer]

    Order:
      type: object
      properties:
        id:
          type: integer
        uuid:
          type: string
        type:
          type: object
          properties:
            id:
              type: integer
              enum: [1, 2, 3, 4, 5, 6]
            label:
              type: string
              enum: [New, Renewal, Trial, Coupon redemption, Gift, Offline]
        status:
          type: string
          enum: [creating, ready, paid, cancelled]
        item:
          type: object
          properties:
            id:
              type: integer
            code:
              type: string
            description:
              type: string
        reference_code:
          type: object
          properties:
            code:
              type: string
              nullable: true
            type:
              type: string
              enum: [Promo code, Renewal coupon code, Coupon code, Sales code]
              nullable: true
            tags:
              type: array
              items:
                type: string
        billing_address:
          type: object
          properties:
            line_1:
              type: string
            line_2:
              type: string
            city:
              type: string
            state:
              type: string
            postal_code:
              type: string
            country:
              type: string
        recipient:
          type: object
          properties:
            id:
              type: integer
            stripe_link:
              type: string
            first_name:
              type: string
            last_name:
              type: string
            email:
              type: string
            phone:
              type: object
              properties:
                home:
                  type: string
                mobile:
                  type: string
        amount:
          type: object
          properties:
            item:
              type: float
            sales_tax:
              type: float
            total:
              type: float
            currency:
              type: string
        payment:
          type: object
          properties:
            paid_at:
              type: string
              format: date-time
              nullable: true
            paid_via:
              type: string
              enum: [Stripe, PayPal]
              nullable: true
            link:
              type: string
              nullable: true
        created_at:
          type: string
          format: date-time

    Plan:
      type: object
      properties:
        id:
          type: integer
        type:
          type: object
          properties:
            id:
              type: integer
              enum: [1, 2, 3, 4]
            label:
              type: string
              enum: [Standard, Homeschool, Offline, Deprecated]
        brand_id:
          type: integer
          enum: [1, 2, 3, 4, 5, 6, 7, 8, 9]
        code:
          type: string
        description:
          type: string
        price:
          type: object
          properties:
            amount:
              type: float
            original_amount:
              type: float
            saving_amount:
              type: float
            currency:
              type: string
        is_recurring:
          type: boolean
        billing_period:
          type: object
          properties:
            count:
              type: integer
            extra_count:
              type: integer
            interval:
              type: string
              enum: [day, week, month, year]
        student_limit:
          type: integer

    Links:
      type: object
      properties:
        first:
          type: string
        last:
          type: string
        prev:
          type: string
        next:
          type: string

    Meta:
      type: object
      properties:
        current_page:
          type: integer
        from:
          type: integer
        last_page:
          type: integer
        links:
          type: array
          items:
            type: object
            properties:
              url:
                type: string
              label:
                type: string
              active:
                type: boolean
        path:
          type: string
        per_page:
          type: integer
        to:
          type: integer
        total:
          type: integer

paths:
  /auth/register:
    post:
      summary: Register a new user
      tags: [Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - brand_id
                - type
                - first_name
                - last_name
                - email
                - username
                - password
              properties:
                brand_id:
                  type: integer
                  enum: [1, 2, 3, 4, 5, 6, 7, 8, 9]
                type:
                  type: string
                  enum: [customer, school]
                first_name:
                  type: string
                  maxLength: 255
                last_name:
                  type: string
                  maxLength: 255
                email:
                  type: string
                  format: email
                  maxLength: 255
                username:
                  type: string
                  maxLength: 255
                home_phone:
                  type: string
                  maxLength: 50
                  nullable: true
                mobile_phone:
                  type: string
                  maxLength: 50
                  nullable: true
                address_line_1:
                  type: string
                  maxLength: 255
                  nullable: true
                address_line_2:
                  type: string
                  maxLength: 255
                  nullable: true
                address_city:
                  type: string
                  maxLength: 100
                  nullable: true
                address_state:
                  type: string
                  maxLength: 100
                  nullable: true
                address_postal_code:
                  type: string
                  maxLength: 50
                  nullable: true
                address_country:
                  type: string
                  maxLength: 2
                  nullable: true
                password:
                  type: string
                  minLength: 8
                  format: password
                password_confirmation:
                  type: string
                  format: password
      responses:
        "201":
          description: User registered successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: User registered successfully
                  data:
                    type: object
                    properties:
                      token:
                        type: string
        "422":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /auth/login:
    post:
      summary: Login user
      tags: [Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
      responses:
        "200":
          description: User logged in successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: User logged in successfully
                  data:
                    type: object
                    properties:
                      token:
                        type: string
        "422":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /auth/me:
    get:
      summary: Get authenticated user
      tags: [Authentication]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: User found
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: User found
                  data:
                    type: object
                    properties:
                      user:
                        $ref: "#/components/schemas/User"
        "401":
          description: Unauthorized
        "404":
          description: User not found

  /auth/logout:
    post:
      summary: Logout user
      tags: [Authentication]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: User logged out successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: User logged out successfully
        "401":
          description: Unauthorized

  /auth/refresh:
    post:
      summary: Refresh authentication token
      tags: [Authentication]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Token refreshed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Token refreshed successfully
                  data:
                    type: object
                    properties:
                      token:
                        type: string
        "401":
          description: Unauthorized

  /oauth/{provider}:
    get:
      summary: Get OAuth redirect URL
      tags: [Authentication]
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
            enum: [google]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - brand_id
              properties:
                brand_id:
                  type: integer
                  enum: [1, 2, 3, 4, 5, 6, 7, 8, 9]
      responses:
        "200":
          description: Redirect URL generated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Redirect to Google.
                  data:
                    type: object
                    properties:
                      url:
                        type: string
        "400":
          description: Invalid provider
        "422":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

    post:
      summary: Exchange OAuth code for authentication token
      tags: [Authentication]
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
            enum: [google]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - brand_id
                - code
              properties:
                brand_id:
                  type: integer
                  enum: [1, 2, 3, 4, 5, 6, 7, 8, 9]
                code:
                  type: string
      responses:
        "200":
          description: Authenticated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Authenticated via Google.
                  data:
                    type: object
                    properties:
                      token:
                        type: string
        "400":
          description: Invalid provider
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
                example:
                  message: Invalid OAuth provider.
                  errors:
                    provider:
                      - The provider is invalid.
        "422":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
                example:
                  message: The code field is required.
                  errors:
                    code:
                      - The code field is required.

  /orders:
    post:
      summary: Create a new order
      tags: [Orders]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - type
                - item_id
              properties:
                type:
                  type: integer
                  enum: [1, 2, 3, 4, 5, 6]
                item_id:
                  type: integer
                reference_code:
                  type: string
                reference_code_type:
                  type: integer
                  enum: [1, 2, 3, 4]

      responses:
        "200":
          description: Order created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Order created successfully.
                  data:
                    type: object
                    properties:
                      order:
                        type: string
                        example: a239796c-884c-4120-8943-84ce0329d8e3
        "403":
          description: Unauthorized
        "422":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /orders/{uuid}:
    get:
      summary: Get order details
      tags: [Orders]
      security:
        - bearerAuth: []
      parameters:
        - name: uuid
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Order details retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      order:
                        $ref: "#/components/schemas/Order"
        "401":
          description: Unauthorized
        "404":
          description: Order not found

  /orders/search:
    post:
      summary: Search orders
      tags: [Orders]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                type:
                  type: integer
                  enum: [1, 2, 3, 4, 5, 6]
                status:
                  type: string
                  enum: [creating, ready, paid, cancelled]
                item_id:
                  type: integer
                reference_code:
                  type: string
                reference_code_type:
                  type: integer
                  enum: [1, 2, 3, 4]
      responses:
        "200":
          description: Orders retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      orders:
                        type: array
                        items:
                          $ref: "#/components/schemas/Order"
                  links:
                    $ref: "#/components/schemas/Links"
                  meta:
                    $ref: "#/components/schemas/Meta"
        "401":
          description: Unauthorized

  /plans/search:
    post:
      summary: Search plans
      tags: [Plans]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - brand_id
              properties:
                brand_id:
                  type: integer
                  enum: [1, 2, 3, 4, 5, 6, 7, 8, 9]
                type:
                  type: integer
                  enum: [1, 2, 3, 4]
                is_testing:
                  type: boolean
                renewal_coupon_code:
                  type: string
                promo_code:
                  type: string
                nonce_code:
                  type: string
                pagination:
                  type: boolean
                page:
                  type: integer
                per_page:
                  type: integer
      responses:
        "200":
          description: Plans retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      plans:
                        type: array
                        items:
                          $ref: "#/components/schemas/Plan"
                  links:
                    $ref: "#/components/schemas/Links"
                  meta:
                    $ref: "#/components/schemas/Meta"
        "422":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
